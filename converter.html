<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 15px;
            background-color: #ecf0f1;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #bdc3c7;
        }

        .container h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            font-size: 15px;
        }

        input[type="number"] {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.97);
        }

        .result-text {
            display: block;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eaf4fc;
            border: 1px solid #3498db;
            color: #2c3e50;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Resume</a>
        <h2>Measurement Converter</h2>
        <p class="subtitle">Length Converter (Inches to Cm)</p>

        <div class="form-group">
            <label for="length-inch">Enter Inch:</label>
            <input type="number" id="length-inch" placeholder="0" min="0" step="any" value="3">
            <button type="button" onclick="convertLength()">Submit</button>
        </div>

        <div id="length-result" class="result-text">Equal to 7.62 cm</div>
    </div>

    <script>
        function convertLength() {
            const inchInput = document.getElementById("length-inch").value;
            const inch = parseFloat(inchInput);
            const resultText = document.getElementById("length-result");

            if (inchInput === "" || isNaN(inch) || inch < 0) {
                alert("Please enter a valid positive number.");
                resultText.style.display = "none";
                return;
            }

            const cm = (inch * 2.54).toFixed(2);
            resultText.textContent = `Equal to ${cm} cm`;
            resultText.style.display = "block";
        }
    </script>
</body>
</html>
