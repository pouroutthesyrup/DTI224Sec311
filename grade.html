<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Grade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 15px;
            background-color: #ecf0f1;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #bdc3c7;
        }

        .container h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .student-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            font-size: 15px;
        }

        input[type="number"] {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.97);
        }

        .result-text {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eaf4fc;
            border: 1px solid #3498db;
            color: #2c3e50;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Resume</a>
        <h2>Grade Calculator</h2>

        <div class="form-group">
            <label for="score-input">Enter Score:</label>
            <input type="number" id="score-input" placeholder="0 - 100" min="0" max="100">
            <button type="button" onclick="calculateGrade()">Submit</button>
        </div>

        <div id="grade-result" class="result-text"></div>
    </div>

    <script>
        function calculateGrade() {
            const scoreInput = document.getElementById("score-input").value;
            const score = parseFloat(scoreInput);
            const resultDiv = document.getElementById("grade-result");

            if (scoreInput === "" || isNaN(score) || score < 0 || score > 100) {
                alert("Please enter a valid score between 0 and 100.");
                resultDiv.style.display = "none";
                return;
            }

            let grade = "";
            if (score >= 80) grade = "A";
            else if (score >= 70) grade = "B";
            else if (score >= 60) grade = "C";
            else if (score >= 50) grade = "D";
            else grade = "F";

            resultDiv.textContent = `Grade: ${grade} (${score}%)`;
            resultDiv.style.display = "block";
        }
    </script>
</body>
</html>
